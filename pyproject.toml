[project]
name = "payments-ledger"
version = "0.1.0"
description = "Payments ledger system showcasing mock currency transfer using postgres"
readme = "README.md"
authors = [
    { name = "Sagar Patel", email = "patel.sagar2611@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
payments-ledger = "payments:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "payments"

[tool.mypy]
strict = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes (default errors)
    "I",   # isort (Import sorting)
    "B",   # flake8-bugbear (Bug prevention)
    "UP",  # pyupgrade (Syntax modernization)
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.16.10",
]
